name: Build and Push Docker Dev Image

on:
  push:
    branches:
      - main   # Only build when main branch updates
  workflow_dispatch:  # Allow manual trigger


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

  
      - name: Build Docker dev Image
        run: |
          docker build -t ghcr.io/toomanyfiles/tmf-timetable-backend:dev .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Dev Image with version, minor, major, and latest tags
        run: |
          docker push ghcr.io/toomanyfiles/tmf-timetable-backend:dev